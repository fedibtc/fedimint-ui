name: docker-ci

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            fedibtc/fedimint-ui
          tags: |
            type=semver,pattern={{version}}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: oscarfedi
          password: ${{ secrets.DOCKER_HUB_FEDIBTC_ACCESS_TOKEN }}

      - name: Build and push fedimint-ui
        uses: docker/build-push-action@v4
        with:
          file: Dockerfile
          push: true
          # QEMU and Buildx were already set up above, but without this the
          # build only produced the runner's own architecture, so the published
          # image was amd64-only. arm64 is needed to run the admin UI alongside
          # guardians on Graviton nodes. Emulated arm64 makes this job slower.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Checkout repository content
        uses: actions/checkout@v4

      # This workflow requires the repository content to be locally available to read the README
      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: oscarfedi
          password: ${{ secrets.DOCKER_HUB_FEDIBTC_ACCESS_TOKEN }}
          repository: fedibtc/fedimint-ui
          readme-filepath: ./README.md
